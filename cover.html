<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>教师智能工作台 · 16大板块封面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#cfd9e3; display:flex; justify-content:center; align-items:flex-start; padding:24px; }
  .cover{
    width:1080px; height:1440px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#eaf4fb 0%,#f4fafe 45%,#e7f7f1 100%);
    border-radius:36px; font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:#1b3a57; box-shadow:0 30px 80px rgba(40,90,140,.25);
  }
  .deco{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.45; }
  .d1{ width:300px;height:300px; background:#bfe0fb; top:-110px; right:-80px; }
  .d2{ width:240px;height:240px; background:#bfeede; bottom:-70px; left:-60px; }
  .star{ position:absolute; color:#7cc6f0; font-size:24px; opacity:.7;}
  .wrap{ position:relative; z-index:2; padding:60px 56px; height:100%; display:flex; flex-direction:column; }
  .top-tag{
    align-self:flex-start; background:#2f80ed; color:#fff; font-size:28px; font-weight:700;
    padding:12px 28px; border-radius:999px; letter-spacing:2px; box-shadow:0 10px 24px rgba(47,128,237,.35);
  }
  .title{ margin-top:34px; font-size:96px; font-weight:900; line-height:1.08; letter-spacing:2px; }
  .title .hl{ background:linear-gradient(90deg,#2f80ed,#22b07d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle{ margin-top:20px; font-size:38px; font-weight:600; color:#3c5a76; }
  .subtitle b{ color:#2f80ed; }
  .grid{ margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .cell{
    background:rgba(255,255,255,.86); border:2px solid #e3eef7; border-radius:20px;
    padding:16px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(60,120,180,.10);
  }
  .dot{ width:70px;height:70px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:36px; font-weight:800; margin-bottom:10px; box-shadow:0 6px 14px rgba(0,0,0,.14);}
  .nm{ font-size:24px; font-weight:700; color:#27425c; text-align:center; line-height:1.18; }
  .foot{
    margin-top:auto; background:linear-gradient(90deg,#2f80ed,#22b07d); border-radius:24px;
    padding:30px 38px; color:#fff; text-align:center;
  }
  .foot .big{ font-size:42px; font-weight:900; }
  .foot .sm{ font-size:28px; opacity:.94; margin-top:8px;}
</style>
</head>
<body>
  <div class="cover">
    <div class="deco d1"></div><div class="deco d2"></div>
    <div class="star" style="top:240px;left:48px">✦</div>
    <div class="star" style="top:520px;right:80px;color:#9be0c4">✦</div>
    <div class="star" style="bottom:300px;left:120px;color:#ffd27a">✦</div>
    <div class="wrap">
      <div class="top-tag">班主任必备 · AI智能助手</div>
      <div class="title">教师<span class="hl">智能</span>工作台</div>
      <div class="subtitle"><b>16</b> 大功能板块 · 教学全流程一站覆盖</div>
      <div class="grid">
        <div class="cell"><div class="dot" style="background:#2f80ed">台</div><div class="nm">首页仪表盘</div></div>
        <div class="cell"><div class="dot" style="background:#7c3aed">备</div><div class="nm">备课资源库</div></div>
        <div class="cell"><div class="dot" style="background:#e11d48">错</div><div class="nm">错题管理库</div></div>
        <div class="cell"><div class="dot" style="background:#16a34a">成</div><div class="nm">成绩分析库</div></div>
        <div class="cell"><div class="dot" style="background:#0d9488">趋</div><div class="nm">成绩趋势对比</div></div>
        <div class="cell"><div class="dot" style="background:#ea580c">卷</div><div class="nm">试卷/习题生成</div></div>
        <div class="cell"><div class="dot" style="background:#4f46e5">库</div><div class="nm">我的题库</div></div>
        <div class="cell"><div class="dot" style="background:#0891b2">生</div><div class="nm">学生与班级管理</div></div>
        <div class="cell"><div class="dot" style="background:#0284c7">课</div><div class="nm">课表与教学计划</div></div>
        <div class="cell"><div class="dot" style="background:#059669">档</div><div class="nm">学生成长档案</div></div>
        <div class="cell"><div class="dot" style="background:#e11d48">勤</div><div class="nm">考勤与请假</div></div>
        <div class="cell"><div class="dot" style="background:#8b5cf6">联</div><div class="nm">家校沟通</div></div>
        <div class="cell"><div class="dot" style="background:#d97706">业</div><div class="nm">作业管理</div></div>
        <div class="cell"><div class="dot" style="background:#475569">研</div><div class="nm">教研与跟踪</div></div>
        <div class="cell"><div class="dot" style="background:#6366f1">历</div><div class="nm">待办与工作日历</div></div>
        <div class="cell"><div class="dot" style="background:#ca8a04">具</div><div class="nm">教师工具箱</div></div>
      </div>
      <div class="foot">
        <div class="big">覆盖备课 → 上课 → 作业 → 考试 → 班级管理</div>
        <div class="sm">让班主任减负 · 让教学更高效 ✨</div>
      </div>
    </div>
  </div>
</body>
</html>
